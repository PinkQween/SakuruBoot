name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Unit tests (host build, Ubuntu) ─────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc clang nasm

      - name: Configure (host target)
        run: |
          cmake -B build/host \
            -DSAKURU_TARGET=host \
            -DCMAKE_BUILD_TYPE=Debug \
            -G Ninja

      - name: Build tests
        run: cmake --build build/host --parallel

      - name: Run tests
        run: ctest --test-dir build/host -V --output-on-failure

  # ── UEFI x86_64 cross-compile ────────────────────────────────────────
  uefi-x86_64:
    name: UEFI x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mingw-w64-x86-64 nasm cmake ninja-build

      - name: Configure
        run: |
          cmake -B build/uefi-x86_64 \
            -DSAKURU_TARGET=uefi-x86_64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/uefi-x86_64.cmake \
            -G Ninja

      - name: Build
        run: cmake --build build/uefi-x86_64 --parallel

      - name: Upload EFI image
        uses: actions/upload-artifact@v4
        with:
          name: BOOTX64.EFI
          path: build/uefi-x86_64/BOOTX64.EFI

  # ── UEFI AArch64 cross-compile ───────────────────────────────────────
  uefi-aarch64:
    name: UEFI AArch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-aarch64-linux-gnu nasm cmake ninja-build

      - name: Configure
        run: |
          cmake -B build/uefi-aarch64 \
            -DSAKURU_TARGET=uefi-aarch64 \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/uefi-aarch64.cmake \
            -G Ninja

      - name: Build
        run: cmake --build build/uefi-aarch64 --parallel

      - name: Upload EFI image
        uses: actions/upload-artifact@v4
        with:
          name: BOOTAA64.EFI
          path: build/uefi-aarch64/BOOTAA64.EFI

  # ── BIOS stage1 + stage2 ─────────────────────────────────────────────
  bios:
    name: BIOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc nasm cmake ninja-build

      - name: Configure
        run: |
          cmake -B build/bios \
            -DSAKURU_TARGET=bios \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/bios.cmake \
            -G Ninja

      - name: Build
        run: cmake --build build/bios --parallel

      - name: Upload BIOS images
        uses: actions/upload-artifact@v4
        with:
          name: bios-images
          path: |
            build/bios/stage1.bin
            build/bios/stage2.bin

  # ── QEMU smoke test (UEFI x86_64) ────────────────────────────────────
  qemu-smoke:
    name: QEMU Smoke Test
    runs-on: ubuntu-latest
    needs: uefi-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Download EFI image
        uses: actions/download-artifact@v4
        with:
          name: BOOTX64.EFI
          path: build/uefi-x86_64/

      - name: Run smoke test
        run: bash scripts/test-qemu.sh build/uefi-x86_64/BOOTX64.EFI
        timeout-minutes: 2
